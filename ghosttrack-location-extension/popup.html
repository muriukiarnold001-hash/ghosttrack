<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GhostTrack Location</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font: 14px Arial, sans-serif;
      color: #e5e7eb;
      background: #111827;
    }

    h2 {
      margin: 0 0 6px;
      font-size: 19px;
      color: #fff;
    }

    .subtitle {
      margin: 0 0 18px;
      color: #9ca3af;
      font-size: 12px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 600;
    }

    input {
      display: block;
      width: 100%;
      padding: 10px;
      border: 1px solid #374151;
      border-radius: 6px;
      background: #1f2937;
      color: #fff;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #60a5fa;
      outline-offset: 1px;
    }

    button {
      display: block;
      width: 100%;
      padding: 11px;
      margin-top: 14px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    #activate {
      background: #2563eb;
      color: #fff;
    }

    #activate:hover {
      background: #1d4ed8;
    }

    #stop {
      margin-top: 8px;
      background: #374151;
      color: #fff;
    }

    #stop:hover {
      background: #4b5563;
    }

    #status {
      min-height: 40px;
      margin: 14px 0 0;
      padding: 10px;
      border: 1px solid #374151;
      border-radius: 6px;
      color: #d1d5db;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .note {
      margin: 12px 0 0;
      color: #9ca3af;
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <h2>GhostTrack Location</h2>
  <p class="subtitle">Browser geolocation testing</p>

  <label for="lat">Latitude</label>
  <input
    id="lat"
    type="number"
    step="any"
    min="-90"
    max="90"
    placeholder="-1.2921"
    autocomplete="off"
  >

  <label for="lng">Longitude</label>
  <input
    id="lng"
    type="number"
    step="any"
    min="-180"
    max="180"
    placeholder="36.8219"
    autocomplete="off"
  >

  <button id="activate" type="button">Activate spoofing</button>
  <button id="stop" type="button">Disable spoofing</button>

  <p id="status" role="status" aria-live="polite">
    Loading saved location...
  </p>

  <p class="note">
    After activating, reload the target page to test the selected coordinates.
    This overrides browser geolocation on websites where Chrome allows extension access.
  </p>

  <script src="popup.js"></script>
</body>
</html>
